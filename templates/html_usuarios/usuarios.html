<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>usuários</title>
    <link rel="stylesheet" href="../../static/css/global.css">
    <link rel="stylesheet" href="../../static/css/usuarios.css">
</head>
<body>
    <header>
        <h1>usuarios</h1>
    </header>
    <button>
        <a href="{{url_for('cadastrar_usuario')}}">+ Novo usuario</a>
    </button>
    <div class="usuarios_grid">
        {%for usuario in usuarios %}

         <div class="usuario_card">
            <div class="usuario_avatar">
                {{usuario[1][0]upper}}
            </div>
            <h2>{{usuario[1]}}</h2>
            <span class="
            usuario-perfil
            {% if usuario[3] == 'administrador'%}
              administrador
            {% endif %}
            ">
              {% if usuario[3] == 'administrador%}
                administrador
              {% endif %}
            </span>
         </div>
    </div>
</body>
</html>
